<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="calc">
            <input type="text" id="inp">
            <div class="buttons">
            <!-- <div class="out"> </div> -->
            <div class="box box1"><b>1</b></div>
            <div class="box box2"><b>2</b></div>
            <div class="box box3"><b>3</b></div>
            <div class="box box4"><b>4</b></div>
            <div class="box box5"><b>5</b></div>
            <div class="box box6"><b>6</b></div>
            <div class="box box7"><b>7</b></div>
            <div class="box box8"><b>8</b></div>
            <div class="box box9"><b>9</b></div>
            <div class="box box10"><b>0</b></div>
            <div class="boxa"><b>-</b></div>
            <div class="boxa"><b>+</b></div>
            <div class="boxa"><b>*</b></div>
            <div class="boxa"><b>/</b></div>
            <div class="op" onclick="operator()"><b>=</b></div>
            <div class="clear-box" onclick="Delete()"><b>Del</b></div>
            <div class="clear-box" onclick="Clear()"><b>Clear</b></div>

        </div>
        </div>
    </div>
<script src="./script.js"></script>
</body>
</html>
